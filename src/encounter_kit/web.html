function encounter(v){cardIndex=Math.min(cardIndex,v.cards.length-1);const card=v.cards[cardIndex],panel=el('div',undefined,'encounter-card');panel.append(el('div',`${t('position')} ${cardIndex+1}/${v.cards.length}`,'badge'),el('h3',card.title),el('p',card.invitation));for(const choice of card.alternatives)panel.append(el('div',choice,'choice'));$('visual').append(panel);
 const input=el('select');input.id='card';for(const [i,entry]of v.cards.entries()){const option=el('option',`${i+1}. ${l(entry.title)}`);option.value=i;input.append(option);}input.value=cardIndex;input.onchange=()=>{cardIndex=Number(input.value);renderVisual();};control(t('card'),input);
 if(data.live){const controls=$('participant-controls'),state=current.report.state;controls.hidden=false;controls.append(el('p',`${t(state.status)} · ${t('position')} ${state.cardIndex+1}/${v.cards.length}`,'caption'));for(const action of state.legalActions){if(action==='choose'){for(const [i,choice]of v.cards[state.cardIndex].alternatives.entries()){const b=el('button',`${t('choose')}: ${l(choice)}`);b.disabled=busy;b.onclick=()=>act('choose',i);controls.append(b);}}else{const b=el('button',t(action),['start','next'].includes(action)?'primary':'');b.disabled=busy;b.onclick=()=>act(action,0);controls.append(b);}}}}
function renderVisual(){const report=current.report,v=report.visual;$('visual').replaceChildren();$('tools').replaceChildren();$('participant-controls').replaceChildren();$('participant-controls').hidden=true;$('visual-title').textContent=t(report.kind+'Title');$('visual-tag').textContent=report.kind==='encounter'?t(data.live?report.state.status:'preview'):'Go2 PRO';({network,grid,encounter}[v.type])(v);}
function render(){const r=current.report;document.documentElement.lang=lang;document.title=l(r.title)+' · Évia · My Encounter';for(const node of document.querySelectorAll('[data-i18n]'))node.textContent=t(node.dataset.i18n);for(const key of ['en','pt'])$(key).setAttribute('aria-pressed',String(lang===key));$('title').textContent=l(r.title);$('summary').textContent=l(r.summary);$('purpose').textContent=t(r.kind+'Purpose');$('question').textContent=t(r.kind+'Question');$('mode').textContent=t(data.live?'liveMode':'staticMode');$('editor').hidden=!data.live;
 $('cases').replaceChildren();data.cases.forEach((entry,i)=>{const option=el('option',entry.input.title);option.value=i;$('cases').append(option);});$('cases').value=caseIndex;
 $('metrics').replaceChildren();for(const metric of r.metrics){const node=el('div',undefined,'metric');node.append(el('span',metric.label,'metric-label'),el('strong',metric.value,'metric-value'));$('metrics').append(node);}renderVisual();$('tables').replaceChildren();for(const section of r.sections){const panel=el('section',undefined,'panel table-panel'),head=el('div',undefined,'panel-head');head.append(el('h2',section.title));panel.append(head);if(!section.rows.length){panel.append(el('p',t('empty'),'panel-body caption'));}else{const scroll=el('div',undefined,'table-scroll'),table=el('table'),thead=el('thead'),tr=el('tr');for(const title of section.columns){const th=el('th',title);th.scope='col';tr.append(th);}thead.append(tr);table.append(thead);const tbody=el('tbody');for(const row of section.rows){const tr=el('tr');for(const value of row)tr.append(el('td',value));tbody.append(tr);}table.append(tbody);scroll.append(table);panel.append(scroll);}$('tables').append(panel);}
 $('cards').replaceChildren();if(!(r.cards??[]).length)$('cards').append(el('p',t('noRoute'),'caption'));for(const card of r.cards??[]){const node=el('article',undefined,'card');node.append(el('h3',card.title));if(card.choices){for(const text of card.steps)node.append(el('p',text));node.append(el('strong',t('options')));const options=el('ul');for(const option of card.choices)options.append(el('li',option));node.append(options);}else{const list=el('ol');for(const step of card.steps)list.append(el('li',step));node.append(list);}node.append(el('footer',card.footer));$('cards').append(node);}$('source').value=JSON.stringify(current.input,null,2);$('provenance').textContent=`${r.scenarioId} · ${r.engineVersion} · SHA-256 ${r.inputSha256}`;}
async function calculate(raw){if(busy)return;busy=true;$('run').disabled=true;$('error').textContent='';$('announcement').textContent=t('calculating');try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:raw});const result=await response.json();if(!response.ok)throw new Error(result.error||t('failed'));current=result;loadedAt=Date.now();if(current.report.kind==='encounter')cardIndex=current.report.state.cardIndex;render();$('announcement').textContent=t('computed');}catch(error){$('error').textContent=error.message;$('announcement').textContent='';}finally{busy=false;$('run').disabled=false;renderVisual();}}
function act(action,choice){const scenario=structuredClone(current.input);const at=Math.max(scenario.nowMs+(Date.now()-loadedAt),scenario.events.at(-1)?.atMs??0);scenario.nowMs=at;scenario.events.push({atMs:at,action,choice});calculate(JSON.stringify(scenario));}
$('cases').onchange=()=>{caseIndex=Number($('cases').value);current=data.cases[caseIndex];routeIndex=stepIndex=cardIndex=0;loadedAt=Date.now();$('error').textContent='';$('announcement').textContent='';render();};for(const key of ['en','pt'])$(key).onclick=()=>{lang=key;render();};$('print').onclick=()=>window.print();$('downloadReport').onclick=()=>download(current.report.scenarioId+'-report.json',current.report);$('downloadInput').onclick=()=>download(current.input.scenarioId+'.json',current.input);$('run').onclick=()=>calculate($('source').value);$('reset').onclick=()=>{current=data.cases[caseIndex];routeIndex=stepIndex=cardIndex=0;loadedAt=Date.now();$('error').textContent='';$('announcement').textContent='';render();};render();
</script>
