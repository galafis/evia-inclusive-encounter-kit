[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"
[project]
name = "evia-inclusive-encounter-kit"
version = "1.0.0"
description = "Évia · My Encounter / Évia · Meu Encontro"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name="Gabriel Demetrios Lafis"}]
dependencies = ["jsonschema>=4.23,<5", "evia-local-event-journal-offline @ git+https://github.com/galafis/evia-local-event-journal.git@d256efd46e0b1724c1e5c76de9a29fcd7846bfe8"]
[project.scripts]
evia-inclusive-encounter-kit = "encounter_kit.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
encounter_kit = ["*.json", "*.html"]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
